<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TPS &amp; Token</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--oc-font, system-ui, "Microsoft YaHei", sans-serif);
    font-size: 0.857rem;
    line-height: 1.5;
    color: var(--oc-fg, inherit);
    background: transparent;
    overflow: hidden;
  }
  #root { padding: 2px 0; }
  .row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.4;
  }
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--oc-muted, #888);
    align-self: center;
    flex: none;
  }
  .dot.live { background: var(--oc-primary, #888); animation: pulse 1s ease-in-out infinite; }
  .dot.wait { background: transparent; border: 1px solid var(--oc-primary, #888); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .value {
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-size: 1.214rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .unit { color: var(--oc-muted, #888); font-size: 0.786rem; }
  .sparkrow {
    display: block;
    margin: 1px 0 3px;
    color: var(--oc-primary, #888);
  }
  .sparkrow svg { display: block; width: 100%; }
  .spark-line { stroke: currentColor; }
  .spark-area { fill: currentColor; opacity: 0.18; }
  .muted { color: var(--oc-muted, #888); }
  .value.stale { color: var(--oc-muted, #888); }
  .meta {
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-size: 0.786rem;
    color: var(--oc-muted, #888);
    font-variant-numeric: tabular-nums;
  }
  .tag {
    font-size: 0.714rem;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 0 4px;
    opacity: 0.8;
    flex: none;
  }
  .cache {
    display: grid;
    grid-template-columns: 2.25rem minmax(0, 1fr) 3rem 2.25rem;
    align-items: center;
    gap: 0.357rem;
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-size: 0.786rem;
    color: var(--oc-muted, #888);
    font-variant-numeric: tabular-nums;
  }
  .cache-label { flex: none; }
  .hitbar {
    display: block;
    height: 0.286rem;
    border-radius: 0.143rem;
    background: var(--oc-subtle, #3a3a3a);
    overflow: hidden;
  }
  .hitbar .fill {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--oc-primary, #6af);
  }
  .cache-pct { color: var(--oc-fg, inherit); width: 3rem; text-align: right; }
  .cache-delta { flex: none; width: 2.25rem; text-align: right; }
  .cache-delta.up { color: var(--oc-success, #3c3); }
  .cache-delta.down { color: var(--oc-error, #f66); }
  .daytotal { align-items: baseline; margin-top: 6px; }
  .day-value {
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-size: 1rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }
  .day-part { display: inline-flex; align-items: baseline; gap: 3px; flex: none; }
  .day-part .k { opacity: 0.7; }
  .day-part .v { color: var(--oc-fg, inherit); opacity: 0.9; }
  .day-sep { opacity: 0.45; flex: none; }
  .row[hidden], .day-part[hidden], .day-sep[hidden] { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="main.js"></script>
</body>
</html>
